<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>编辑任务 - 航线后台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/MKJ/assets/css/tasks.css" />
    <link rel="stylesheet" href="/MKJ/assets/css/visual-v1.css?v=20260812-v1.0" />
    <link rel="stylesheet" href="/MKJ/assets/css/visual-v1.1.css?v=20260812-v1.1" />
    <link rel="stylesheet" href="/MKJ/assets/css/visual-v1.2.css?v=20260815-v1.2" />
    <link rel="stylesheet" href="/MKJ/assets/css/task-workspace.css?v=20260817-v1.5" />
    <script type="module" src="/MKJ/assets/js/theme/theme-controller.js?v=20260812-v1.1"></script>
      <script type="module" src="/MKJ/assets/js/ui/visual-assets.js?v=20260815-v1.2"></script>
  </head>
  <body class="task-page task-admin-page" data-task-admin-view="editor" data-task-workspace>
    <header class="task-topbar task-admin-topbar">
      <a class="task-brand" href="/MKJ/admin/"><span>航</span><strong>管理后台</strong></a>
      <nav class="task-nav" aria-label="后台导航"><a href="/MKJ/admin/tasks/">任务管理</a><a aria-current="page" href="/MKJ/admin/tasks/edit/">编辑任务</a></nav>
      <div class="task-user-slot" data-task-reputation-badge aria-live="polite"></div>
    </header>

    <main class="task-shell task-editor-shell" data-task-workspace-main>
      <a class="task-back-link" href="/MKJ/admin/tasks/">← 返回任务管理</a>
      <nav class="task-workflow-steps" data-task-workflow-steps aria-label="编辑任务步骤">
        <button class="task-workflow-step" type="button" data-task-step-target="#task-editor-content">内容</button>
        <button class="task-workflow-step" type="button" data-task-step-target="#task-editor-delivery">交付</button>
        <button class="task-workflow-step" type="button" data-task-step-target="#task-editor-review">发布检查</button>
      </nav>
      <form class="task-editor" id="task-editor-form" data-task-editor-form data-task-admin-write>
        <header class="task-editor-header"><div><p class="task-kicker">TASK EDITOR</p><h1 data-task-editor-title>新建任务</h1></div><span class="task-status" data-task-draft-status>未保存</span></header>
        <div class="task-editor-grid">
          <div class="task-editor-fields">
            <label id="task-editor-content"><span>任务标题</span><input name="title" required maxlength="120" /></label>
            <label><span>任务摘要</span><textarea name="summary" required maxlength="280" rows="3"></textarea></label>
            <label><span>任务内容</span><textarea name="body" required maxlength="8000" rows="12"></textarea></label>
            <div class="task-field-grid" id="task-editor-delivery">
              <label><span>大类</span><select name="categoryId" required data-task-category-select></select></label>
              <label><span>子类</span><select name="subcategoryId" data-task-subcategory-select></select></label>
              <label><span>完成奖励</span><input name="rewardPoints" type="number" min="0" max="10000" step="1" required /></label>
              <label><span>申请人数</span><input name="applicationLimit" type="number" min="1" max="1000" step="1" required /></label>
              <label><span>截止时间</span><input name="deadlineAt" type="datetime-local" required /></label>
            </div>
            <label><span>能力标签</span><input name="skillTags" maxlength="300" placeholder="用逗号分隔" /></label>
          </div>
          <aside class="task-editor-actions" id="task-editor-review">
            <h2>发布检查</h2>
            <ul><li>标题、摘要和正文完整</li><li>截止时间晚于当前时间</li><li>发布前重新检查敏感词</li><li>奖励以保存时数值锁定</li></ul>
            <p class="task-form-message" data-task-form-message role="status"></p>
            <button class="task-button task-button-secondary task-full-button" type="submit" name="intent" value="draft">保存草稿</button>
            <button class="task-button task-button-primary task-full-button" type="submit" name="intent" value="publish">发布任务</button>
          </aside>
        </div>
      </form>
    </main>

    <script src="/MKJ/assets/vendor/supabase-2.111.0.js"></script>
    <script src="/MKJ/supabase-config.js"></script>
    <script type="module" src="/MKJ/assets/js/core/runtime.js?v=20260812-v1.1"></script>
    <script type="module" src="/MKJ/assets/js/core/app-shell.js?v=20260812-v1.1"></script>
    <script type="module" src="/MKJ/assets/js/core/task-integration.js"></script>
    <script type="module" src="/MKJ/assets/js/tasks/task-workspace.js?v=20260817-v1.5"></script>
    <script type="module" src="/MKJ/assets/js/tasks/task-admin.js"></script>
  </body>
</html>
