<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/MKJ/styles.css" />
    <link rel="stylesheet" href="/MKJ/assets/css/admin.css" />
    <link rel="stylesheet" href="/MKJ/admin/admin.css" />
    <link rel="stylesheet" href="/MKJ/assets/css/visual-v1.css?v=20260812-v1.0" />
  </head>
  <body data-admin-page="users">
    <header class="admin-header"><div class="admin-header-inner"><a class="admin-brand" href="/MKJ/admin/">航线 <span>GLOBAL ADMIN</span></a><a class="admin-return" href="/MKJ/">返回网站</a></div></header>
    <main class="admin-container admin-shell">
      <aside class="admin-sidebar"><span>管理控制台</span><nav class="admin-nav" data-admin-nav></nav></aside>
      <section class="admin-main" data-admin-content>
        <p class="admin-kicker">GLOBAL IDENTITY</p>
        <h1>用户管理</h1>
        <p class="admin-lead">调整角色、声望、禁言状态与精确权限。</p>
        <form class="admin-form" data-admin-reputation-form>
          <div class="admin-form-grid">
            <label>用户 ID<input name="userId" required /></label>
            <label>声望调整<input name="amount" type="number" required /></label>
            <label>调整原因<input name="reason" maxlength="160" required /></label>
          </div>
          <div class="admin-form-actions"><button class="admin-primary-button" type="submit">调整声望</button></div>
        </form>
        <p class="admin-status" data-admin-status hidden></p>
        <div class="admin-table-wrap" data-admin-table></div>
        <div class="admin-form-actions"><button class="admin-primary-button" type="button" data-admin-load-more hidden>继续加载</button></div>
      </section>
    </main>
    <footer class="admin-footer"><div class="admin-container">© 2026 航线</div></footer>
    <script src="/MKJ/assets/vendor/supabase-2.111.0.js"></script>
    <script src="/MKJ/supabase-config.js"></script>
