    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/MKJ/styles.css" />

  <body data-admin-page="forum">
    <header class="admin-header"><div class="admin-header-inner"><a class="admin-brand" href="/MKJ/admin/">航线 <span>GLOBAL ADMIN</span></a><a class="admin-return" href="/MKJ/forum/">前往论坛</a></div></header>
    <main class="admin-container admin-shell">
      <aside class="admin-sidebar"><span>管理控制台</span><nav class="admin-nav" data-admin-nav></nav></aside>
      <section class="admin-main" data-admin-content>
        <p class="admin-kicker">FORUM MODERATION</p><h1>论坛管理</h1>
        <p class="admin-lead">具备对应 forum:* 能力的版主或管理员可置顶、锁定和删除内容。</p>
        <form class="admin-form" data-admin-forum-form>
          <div class="admin-form-grid">
            <label>目标类型<select name="target"><option value="post">帖子</option><option value="comment">评论</option></select></label>
            <label>目标 ID<input name="targetId" required /></label>
            <label>操作<select name="action"><option value="PIN">置顶帖子</option><option value="UNPIN">取消置顶</option><option value="LOCK">锁定帖子</option><option value="UNLOCK">解除锁定</option><option value="DELETE">删除内容</option></select></label>
          </div>
          <div class="admin-form-actions"><button class="admin-primary-button" type="submit">执行管理操作</button></div>
        </form>
        <p class="admin-status" data-admin-status hidden></p><div class="admin-table-wrap" data-admin-forum-table></div>
      </section>
    </main>
    <footer class="admin-footer"><div class="admin-container">© 2026 航线</div></footer>
