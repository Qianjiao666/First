<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务详情 - 航线</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/MKJ/assets/css/tasks.css" />
  </head>
  <body class="task-page">
    <header class="task-topbar">
      <a class="task-brand" href="/MKJ/"><span>航</span><strong>航线</strong></a>
      <nav class="task-nav" aria-label="任务导航"><a href="/MKJ/tasks/">任务广场</a><a href="/MKJ/tasks/my/">我的任务</a></nav>
      <div class="task-user-slot" data-task-reputation-badge aria-live="polite"></div>
    </header>

    <main class="task-shell task-detail-shell">
      <a class="task-back-link" href="/MKJ/tasks/">← 返回任务广场</a>
      <div class="task-notice" data-task-message role="status" hidden></div>

      <article class="task-detail" data-task-detail aria-busy="true">
        <header class="task-detail-header">
          <div>
            <p class="task-kicker" data-task-category>正在读取任务</p>
            <h1 data-task-title>任务详情</h1>
            <p class="task-detail-summary" data-task-summary></p>
          </div>
          <div class="task-reward-block"><span>完成奖励</span><strong data-task-reward>--</strong><small>声望</small></div>
        </header>

        <div class="task-detail-grid">
          <div class="task-prose">
            <section><h2>任务内容</h2><div data-task-body></div></section>
            <section><h2>能力要求</h2><ul class="task-tag-list" data-task-tags></ul></section>
            <section>
              <h2>任务附件</h2>
              <ul class="task-attachment-list" data-task-attachments aria-live="polite"><li>暂无附件。</li></ul>
            </section>
            <section>
              <h2>进度时间轴</h2>
              <ol class="task-timeline" data-task-timeline aria-live="polite"><li>正在读取进度。</li></ol>
            </section>
            <section>
              <h2>相关讨论</h2>
              <div class="task-related-posts" data-task-related-posts><p>暂无关联讨论。</p></div>
            </section>
          </div>
          <aside class="task-action-panel">
            <dl>
              <div><dt>截止时间</dt><dd data-task-deadline>--</dd></div>
              <div><dt>可接人数</dt><dd data-task-capacity>--</dd></div>
              <div><dt>当前状态</dt><dd data-task-status>--</dd></div>
            </dl>
            <button class="task-button task-button-primary task-full-button" type="button" data-task-apply>申请任务</button>
            <p class="task-action-note" data-task-action-note>登录后可提交申请。</p>
          </aside>
        </div>
      </article>
    </main>

    <dialog class="task-dialog" id="task-apply-dialog" aria-labelledby="task-apply-title">
      <form method="dialog" class="task-dialog-close"><button aria-label="关闭申请窗口" title="关闭">×</button></form>
      <form id="task-apply-form" data-task-apply-form>
        <p class="task-kicker">APPLICATION / 申请</p>
        <h2 id="task-apply-title">申请这项任务</h2>
        <label><span>申请说明</span><textarea name="applicationNote" required maxlength="800" rows="6" placeholder="说明你的相关经历、可投入时间和交付计划"></textarea></label>
        <p class="task-form-message" data-task-form-message role="status"></p>
        <button class="task-button task-button-primary task-full-button" type="submit">提交申请</button>
      </form>
    </dialog>

    <script src="/MKJ/assets/vendor/supabase-2.111.0.js"></script>
    <script src="/MKJ/supabase-config.js"></script>
    <script type="module" src="/MKJ/assets/js/core/runtime.js"></script>
    <script type="module" src="/MKJ/assets/js/core/task-integration.js"></script>
    <script type="module" src="/MKJ/assets/js/tasks/task-detail.js"></script>
  </body>
</html>
