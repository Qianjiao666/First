<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="航线任务广场" />
    <title>任务广场 - 航线</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/MKJ/assets/css/tasks.css" />
    <link rel="stylesheet" href="/MKJ/announcements/announcements.css" />
    <link rel="stylesheet" href="/MKJ/shared/community-widgets.css" />
    <link rel="stylesheet" href="/MKJ/assets/css/visual-v1.css?v=20260812-v1.0" />
    <link rel="stylesheet" href="/MKJ/assets/css/visual-v1.1.css?v=20260812-v1.1" />
    <link rel="stylesheet" href="/MKJ/assets/css/visual-v1.2.css?v=20260815-v1.2" />
    <script type="module" src="/MKJ/assets/js/theme/theme-controller.js?v=20260812-v1.1"></script>
      <script type="module" src="/MKJ/assets/js/ui/visual-assets.js?v=20260815-v1.2"></script>
  </head>
  <body class="task-page">
    <header class="task-topbar">
      <a class="task-brand" href="/MKJ/" aria-label="返回航线首页"><span>航</span><strong>航线</strong></a>
      <nav class="task-nav" aria-label="任务导航">
        <a aria-current="page" href="/MKJ/tasks/">任务广场</a>
        <a href="/MKJ/tasks/my/">我的任务</a>
        <a href="/MKJ/admin/">管理后台</a>
      </nav>
      <div class="task-user-controls">
        <div class="task-user-slot" data-task-reputation-badge aria-live="polite"></div>
        <div class="task-notification-slot" data-task-notification-slot></div>
      </div>
    </header>

    <div class="task-announcement-slot" data-task-announcement-slot></div>

    <main class="task-shell">
      <section class="task-heading" aria-labelledby="task-page-title">
        <div>
          <p class="task-kicker">TASK EXCHANGE / 任务协作</p>
          <h1 id="task-page-title">找到一件值得完成的事</h1>
          <p>按方向、难度和截止时间筛选公开任务，申请后在个人任务页跟进进度。</p>
        </div>
        <div class="task-heading-actions"><a class="task-button task-button-secondary" href="/MKJ/tasks/create/" data-task-create-link hidden>发布任务</a><a class="task-button task-button-primary" href="/MKJ/tasks/my/">查看我的任务</a></div>
      </section>

      <section class="task-filter-band" aria-label="筛选任务">
        <label class="task-search">
          <span>搜索</span>
          <input type="search" placeholder="任务标题或能力标签" data-task-filter-query />
        </label>
        <label>
          <span>方向</span>
          <select data-task-filter-category><option value="">全部方向</option></select>
        </label>
        <label>
          <span>协作方式</span>
          <select data-task-filter-mode><option value="">全部任务</option><option value="collaboration">多人协作</option><option value="individual">个人任务</option></select>
        </label>
        <label>
          <span>排序</span>
          <select data-task-filter-sort>
            <option value="published_at.desc">最新发布</option>
            <option value="deadline_at.asc">即将截止</option>
            <option value="reward_points.desc">奖励较高</option>
          </select>
        </label>
        <button class="task-icon-button" type="button" data-task-filter-reset title="清除筛选" aria-label="清除筛选">×</button>
      </section>

      <section class="task-content-grid">
        <div class="task-results">
          <div class="task-section-heading">
            <h2>公开任务</h2>
            <output data-task-result-count>正在读取</output>
            <output data-task-publishing-eligibility aria-live="polite"></output>
          </div>
          <div class="task-notice" data-task-message role="status" hidden></div>
          <div class="task-list" data-task-list aria-busy="true">
            <article class="task-listing task-listing-skeleton" aria-hidden="true"></article>
            <article class="task-listing task-listing-skeleton" aria-hidden="true"></article>
            <article class="task-listing task-listing-skeleton" aria-hidden="true"></article>
          </div>
          <nav class="task-pagination" aria-label="任务分页" data-task-pagination hidden></nav>
        </div>

        <aside class="task-side-panel">
          <h2>任务节奏</h2>
          <dl class="task-metrics">
            <div><dt>待申请</dt><dd data-task-metric-open>--</dd></div>
            <div><dt>本周截止</dt><dd data-task-metric-deadline>--</dd></div>
            <div><dt>已完成</dt><dd data-task-metric-complete>--</dd></div>
          </dl>
          <a class="task-text-link" href="/MKJ/forum/">进入论坛讨论 →</a>
        </aside>
      </section>
    </main>

    <template id="task-listing-template">
      <article class="task-listing">
        <div class="task-listing-main">
          <div class="task-listing-meta"><span data-task-category></span><time data-task-deadline></time></div>
          <p data-task-collaboration-meta></p>
          <h3><a data-task-title></a></h3>
          <p data-task-summary></p>
          <ul class="task-tag-list" data-task-tags aria-label="能力标签"></ul>
        </div>
        <div class="task-listing-reward"><span>奖励</span><strong data-task-reward></strong><small>声望</small></div>
      </article>
    </template>

    <script src="/MKJ/assets/vendor/supabase-2.111.0.js"></script>
    <script src="/MKJ/supabase-config.js"></script>
    <script type="module" src="/MKJ/assets/js/core/runtime.js?v=20260812-v1.1"></script>
    <script type="module" src="/MKJ/assets/js/core/app-shell.js?v=20260812-v1.1"></script>
    <script type="module" src="/MKJ/shared/community-widgets.js"></script>
    <script type="module" src="/MKJ/assets/js/core/task-integration.js"></script>
    <script type="module" src="/MKJ/assets/js/tasks/task-list.js"></script>
  </body>
</html>
